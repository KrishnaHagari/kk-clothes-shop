<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - KK Clothes</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .edit-container {
            max-width: 550px;
            margin: 40px auto;
            background: #ffffff;
            padding: 28px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .edit-container h2 {
            margin-bottom: 20px;
            color: #1f2937;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-update {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-update:hover {
            background-color: #1d4ed8;
        }
        .btn-cancel {
            margin-left: 10px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-cancel:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="edit-container">
        <h2>Edit Product #{{ product.id }}</h2>
        <form method="post" action="/edit/{{ product.id }}">
            <div class="form-group">
                <label>Item Name:</label>
                <input type="text" name="item_name" value="{{ product.item_name }}" required>
            </div>

            <div class="form-group">
                <label>Category:</label>
                <select name="category" required>
                    <option value="Men" {% if product.category == 'Men' %}selected{% endif %}>Men</option>
                    <option value="Women" {% if product.category == 'Women' %}selected{% endif %}>Women</option>
                    <option value="Kids" {% if product.category == 'Kids' %}selected{% endif %}>Kids</option>
                </select>
            </div>

            <div class="form-group">
                <label>Size:</label>
                <input type="text" name="size" value="{{ product.size }}" required>
            </div>

            <div class="form-group">
                <label>Cost Price (₹):</label>
                <input type="number" step="0.01" name="cost_price" value="{{ product.cost_price }}" required>
            </div>

            <div class="form-group">
                <label>Selling Price (₹):</label>
                <input type="number" step="0.01" name="selling_price" value="{{ product.selling_price }}" required>
            </div>

            <div class="form-group">
                <label>Quantity:</label>
                <input type="number" name="quantity" value="{{ product.quantity }}" required>
            </div>

            <button type="submit" class="btn-update">Update Product</button>
            <a href="/" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
